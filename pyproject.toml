[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contour-alternatives"
version = "0.1.0"
description = "Tools for generating and evaluating segmentation contour alternatives based on clustering of the total discrepancy between two segmentations into spatially and directionally coherent edit regions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "scikit-image",
    "nibabel",
    "tqdm",
    "openpyxl",
    "optuna",
    "surface-distance",
    "seg-metrics",
    "pydicom",
    "rt-utils",
    "SimpleITK",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"